name: "Setup and install"
description: "Common setup steps for Actions"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version-file: "package.json"
        cache: "pnpm"

    - shell: bash
      run: pnpm add -g turbo

    - shell: bash
      run: pnpm install

    # Paraglide output is generated (self-ignored via src/paraglide/.gitignore),
    # so it is never committed. Both `lint` and `knip` resolve @/paraglide/messages,
    # and neither job builds -- compile it here so every job gets a complete tree.
    - name: Compile Paraglide messages
      shell: bash
      run: pnpm -F @taiyomoe/web run compile:messages
