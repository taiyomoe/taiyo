name: CI / Integration tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "plans/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
  push:
    branches: ["main", "develop"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "plans/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
  merge_group:
  workflow_dispatch:

env:
  FORCE_COLOR: 3

jobs:
  integration-tests:
    name: Vitest (integration)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taiyo
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 10

      dragonfly:
        image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
        ports: ["6379:6379"]
        env:
          DFLY_cluster_mode: emulated
          DFLY_lock_on_hashtags: 1
        options: >-
          --ulimit memlock=-1 --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10

      meilisearch:
        image: getmeili/meilisearch:latest
        ports: ["7700:7700"]
        env:
          MEILI_MASTER_KEY: ci-master-key
          MEILI_NO_ANALYTICS: "true"
        options: >-
          --health-cmd "curl -sf http://localhost:7700/health" --health-interval
          5s --health-timeout 3s --health-retries 20

      rustfs:
        image: rustfs/rustfs:latest
        ports: ["9000:9000"]
        env:
          RUSTFS_ACCESS_KEY: ci-access-key
          RUSTFS_SECRET_KEY: ci-secret-key
          RUSTFS_VOLUMES: /data
        options: >-
          --health-cmd "curl -f http://127.0.0.1:9000/health" --health-interval
          5s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/taiyo
      DRAGONFLY_URL: redis://localhost:6379
      MEILISEARCH_HOST: http://localhost:7700
      MEILISEARCH_API_KEY: ci-master-key
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY_ID: ci-access-key
      S3_SECRET_ACCESS_KEY: ci-secret-key
      S3_BUCKET_NAME: taiyo-ci
      S3_PUBLIC_URL: http://localhost:9000/taiyo-ci
      BETTER_AUTH_URL: http://localhost:3002
      BETTER_AUTH_SECRET: ci-better-auth-secret-not-actually-secret-in-ci
      RESEND_API_KEY: re_dummy
    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Integration tests
        run: pnpm test:integration
