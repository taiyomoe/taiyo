name: Discord draft

# Adding the discord-draft label to the release PR writes the pt-BR announcement as a
# comment, once. Build images posts that comment, as edited, after the release deploys.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  draft:
    name: Write the Discord draft
    if: ${{ github.event.label.name == 'discord-draft' && startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - run: node packages/scripts/src/release/write-discord-draft.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          DISCORD_ROLE_ID: "1189014041813852170"
