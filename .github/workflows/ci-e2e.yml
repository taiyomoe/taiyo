name: CI / End-to-end tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
  push:
    branches: ["main", "develop"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
  merge_group:
  workflow_dispatch:

env:
  FORCE_COLOR: 3

jobs:
  e2e-tests:
    name: Playwright (e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      # The env files come first: the web app builds from the public values they hold while
      # bootstrap starts and seeds the stack, and Chromium installs alongside. Headless runs
      # only need the headless shell, a smaller download than full Chromium.
      - name: Bootstrap, build the web app and install Chromium
        run: |
          pnpm bootstrap --env-only
          pnpm -F @taiyomoe/web build > "$RUNNER_TEMP/build.log" 2>&1 &
          build=$!
          pnpm -F @taiyomoe/web exec playwright install --with-deps --only-shell chromium > "$RUNNER_TEMP/chromium.log" 2>&1 &
          chromium=$!
          pnpm bootstrap
          status=0
          wait "$build" || status=$?
          wait "$chromium" || status=$?
          for log in build chromium; do
            echo "::group::$log"
            cat "$RUNNER_TEMP/$log.log"
            echo "::endgroup::"
          done
          exit "$status"

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
