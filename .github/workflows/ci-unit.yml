name: CI / Unit tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "plans/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
  push:
    branches: ["main", "develop"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "plans/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
  merge_group:
  workflow_dispatch:

env:
  FORCE_COLOR: 3

jobs:
  unit-tests:
    name: Vitest (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Unit tests
        run: pnpm test:unit
