name: CI

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_COLOR: 3

jobs:
  knip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup
        uses: ./tooling/github/setup

      - name: Knip
        run: pnpm knip

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup
        uses: ./tooling/github/setup

      - name: Check
        run: pnpm check:ws:ci

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup
        uses: ./tooling/github/setup
        with:
          prisma-generate: true
          database-url: ${{ secrets.DATABASE_URL }}

      - name: Typecheck
        run: pnpm typecheck

  unit-tests:
    runs-on: ubuntu-latest
    needs: [knip, check, typecheck]
    steps:
      - uses: actions/checkout@v6

      - name: Setup
        uses: ./tooling/github/setup

      - name: Run Unit Tests
        run: pnpm test:unit

  integration-tests:
    runs-on: ubuntu-latest
    needs: [knip, check, typecheck]
    steps:
      - uses: actions/checkout@v6

      - name: Setup
        uses: ./tooling/github/setup
        with:
          prisma-generate: true
          database-url: ${{ secrets.DATABASE_URL }}

      - name: Run Integration Tests
        run: pnpm test:integration
