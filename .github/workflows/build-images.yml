name: Build images

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Images are pushed from main only, so a fork's pull request never gets write access to the registry.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
  push:
    branches: ["main", "develop"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - id: tag
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$MESSAGE" =~ ^chore:\ release\ (v[0-9]+\.[0-9]+\.[0-9]+[^[:space:]]*) ]]; then
            echo "value=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.app }}
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            target: server
          - app: worker
            target: server
          - app: web
            target: web
    env:
      PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      CACHE_TO: ${{ github.event_name != 'pull_request' && format('type=gha,scope={0},mode=max', matrix.app) || '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the web build variables
        if: ${{ matrix.app == 'web' && env.PUSH == 'true' }}
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_BETTER_AUTH_URL: ${{ vars.VITE_BETTER_AUTH_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
        run: |
          missing=0
          for name in VITE_API_URL VITE_BETTER_AUTH_URL VITE_TURNSTILE_SITE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository variable $name is not set"
              missing=1
            fi
          done
          exit $missing

      - uses: docker/setup-buildx-action@v4
        with:
          cleanup: false

      - if: ${{ env.PUSH == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/taiyo-${{ matrix.app }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=${{ needs.version.outputs.tag }},enable=${{ needs.version.outputs.tag != '' }}

      - id: build-args
        name: Build arguments
        run: |
          {
            echo "value<<EOF"
            echo "APP=${{ matrix.app }}"
            echo "VITE_API_URL=${{ vars.VITE_API_URL || 'https://example.invalid' }}"
            echo "VITE_BETTER_AUTH_URL=${{ vars.VITE_BETTER_AUTH_URL || 'https://example.invalid' }}"
            echo "VITE_TURNSTILE_SITE_KEY=${{ vars.VITE_TURNSTILE_SITE_KEY || 'placeholder' }}"
            if [ -n "${{ vars.VITE_DISCORD_INVITE_URL }}" ]; then
              echo "VITE_DISCORD_INVITE_URL=${{ vars.VITE_DISCORD_INVITE_URL }}"
            fi
            if [ -n "${{ vars.VITE_UMAMI_WEBSITE_ID }}" ]; then
              echo "VITE_UMAMI_WEBSITE_ID=${{ vars.VITE_UMAMI_WEBSITE_ID }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}-smoke
          platforms: linux/amd64
          build-args: ${{ steps.build-args.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: ${{ env.CACHE_TO }}

      - name: Push
        if: ${{ env.PUSH == 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.build-args.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.app }}

  tests:
    name: Wait for the tests
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
    steps:
      - name: Wait for every test workflow on this commit to pass
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          required=("CI / Static analysis" "CI / Unit tests" "CI / Integration tests" "CI / End-to-end tests")
          deadline=$((SECONDS + 40 * 60))
          while true; do
            runs=$(gh api "repos/${REPO}/actions/runs?head_sha=${SHA}&event=push&per_page=100" --jq '.workflow_runs')
            pending=0
            for name in "${required[@]}"; do
              run=$(jq -c --arg name "$name" '[.[] | select(.name == $name)] | sort_by(.run_attempt) | last' <<<"$runs")
              if [ "$run" = "null" ] || [ "$(jq -r .status <<<"$run")" != "completed" ]; then
                pending=1
              elif [ "$(jq -r .conclusion <<<"$run")" != "success" ]; then
                echo "::error::${name} did not pass on ${SHA}: $(jq -r .html_url <<<"$run")"
                exit 1
              fi
            done
            if [ "$pending" = 0 ]; then
              echo "Every test workflow passed on ${SHA}."
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::The test workflows did not finish on ${SHA} within 40 minutes."
              exit 1
            fi
            sleep 30
          done

  release:
    name: Release to the cluster
    needs: [version, build, tests]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          repository: taiyomoe/taiyo-deploy
          ssh-key: ${{ secrets.TAIYO_DEPLOY_KEY }}

      - name: Point the release at this commit
        env:
          VERSION: ${{ needs.version.outputs.tag }}
        run: |
          # Only the head of main releases, so an older run never overwrites a newer tag.
          head=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "main moved on to $head: its own run releases it."
            exit 0
          fi

          tag="sha-${GITHUB_SHA::7}"
          sed -i -E "s/(newTag: )sha-[0-9a-f]+/\1${tag}/" apps/taiyo/app/kustomization.yaml
          if git diff --quiet; then
            echo "Already on ${tag}."
            exit 0
          fi

          git config user.name "taiyo-release"
          git config user.email "taiyo-release@users.noreply.github.com"
          git commit -am "chore: release taiyo ${VERSION:-$tag}" -m "From ${GITHUB_REPOSITORY}@${GITHUB_SHA} (${tag})"
          for _ in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1

  announce:
    name: Announce on Discord
    needs: [version, release]
    if: ${{ needs.version.outputs.tag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - run: node packages/scripts/src/release/post-discord-announcement.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ROLE_ID: "1189014041813852170"
