name: Build images

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Pull requests only build, to catch a broken Dockerfile before merge. Images are
# pushed from develop alone, so no workflow triggered by a fork ever gets write access
# to the registry.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
  push:
    branches: ["develop"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # smoke imports the app's entry point inside the built image, with production
          # dependencies only: a runtime import of a dev dependency fails here instead of
          # crashing the pods. The worker starts its queues on import, so it has none.
          - app: api
            target: server
            smoke: >-
              docker run --rm -e TEST=1 -e RESEND_API_KEY=re_smoke -e S3_PUBLIC_URL=https://cdn.example.invalid
              taiyo-api:ci node --import tsx -e "await import('./src/index.ts')"
          - app: worker
            target: server
          - app: web
            target: web
            smoke: >-
              docker run --rm taiyo-web:ci node -e "await import('./dist/server/server.js')"
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      # The web bundle inlines these public values, so a pushed image built without
      # them would ship a broken client.
      - name: Check the web build variables
        if: ${{ matrix.app == 'web' && env.PUSH == 'true' }}
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_BETTER_AUTH_URL: ${{ vars.VITE_BETTER_AUTH_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
        run: |
          missing=0
          for name in VITE_API_URL VITE_BETTER_AUTH_URL VITE_TURNSTILE_SITE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository variable $name is not set"
              missing=1
            fi
          done
          exit $missing

      - uses: docker/setup-buildx-action@v4

      - if: ${{ env.PUSH == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/taiyo-${{ matrix.app }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - id: build-args
        name: Build arguments
        run: |
          {
            echo "value<<EOF"
            echo "APP=${{ matrix.app }}"
            echo "VITE_API_URL=${{ vars.VITE_API_URL || 'https://example.invalid' }}"
            echo "VITE_BETTER_AUTH_URL=${{ vars.VITE_BETTER_AUTH_URL || 'https://example.invalid' }}"
            echo "VITE_TURNSTILE_SITE_KEY=${{ vars.VITE_TURNSTILE_SITE_KEY || 'placeholder' }}"
            if [ -n "${{ vars.VITE_DISCORD_INVITE_URL }}" ]; then
              echo "VITE_DISCORD_INVITE_URL=${{ vars.VITE_DISCORD_INVITE_URL }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          tags: taiyo-${{ matrix.app }}:ci
          build-args: ${{ steps.build-args.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

      - name: Smoke test
        if: ${{ matrix.smoke }}
        run: ${{ matrix.smoke }}

      # Same inputs as Build, so every layer comes from its cache.
      - name: Push
        if: ${{ env.PUSH == 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.build-args.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.app }}
