name: Build images

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Pull requests only build, to catch a broken Dockerfile before merge. Images are
# pushed from main alone, so no workflow triggered by a fork ever gets write access
# to the registry. Pushes to develop build too: they fill the layer cache that pull
# requests, which cannot write a cache other runs see, start from.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
  push:
    branches: ["main", "develop"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The Release workflow merges each release into main as "chore: release vX.Y.Z".
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - id: tag
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$MESSAGE" =~ ^chore:\ release\ (v[0-9]+\.[0-9]+\.[0-9]+[^[:space:]]*) ]]; then
            echo "value=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.app }}
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            target: server
          - app: worker
            target: server
          - app: web
            target: web
    env:
      PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      # A pull request's cache is only visible to that pull request, and its layers evicted
      # the develop cache every pull request reads from.
      CACHE_TO: ${{ github.event_name != 'pull_request' && format('type=gha,scope={0},mode=max', matrix.app) || '' }}
    steps:
      - uses: actions/checkout@v7

      # The web bundle inlines these public values, so a pushed image built without
      # them would ship a broken client.
      - name: Check the web build variables
        if: ${{ matrix.app == 'web' && env.PUSH == 'true' }}
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_BETTER_AUTH_URL: ${{ vars.VITE_BETTER_AUTH_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
        run: |
          missing=0
          for name in VITE_API_URL VITE_BETTER_AUTH_URL VITE_TURNSTILE_SITE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository variable $name is not set"
              missing=1
            fi
          done
          exit $missing

      # The runner is thrown away after the job: removing the builder only adds a step.
      - uses: docker/setup-buildx-action@v4
        with:
          cleanup: false

      - if: ${{ env.PUSH == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/taiyo-${{ matrix.app }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=${{ needs.version.outputs.tag }},enable=${{ needs.version.outputs.tag != '' }}

      - id: build-args
        name: Build arguments
        run: |
          {
            echo "value<<EOF"
            echo "APP=${{ matrix.app }}"
            echo "VITE_API_URL=${{ vars.VITE_API_URL || 'https://example.invalid' }}"
            echo "VITE_BETTER_AUTH_URL=${{ vars.VITE_BETTER_AUTH_URL || 'https://example.invalid' }}"
            echo "VITE_TURNSTILE_SITE_KEY=${{ vars.VITE_TURNSTILE_SITE_KEY || 'placeholder' }}"
            if [ -n "${{ vars.VITE_DISCORD_INVITE_URL }}" ]; then
              echo "VITE_DISCORD_INVITE_URL=${{ vars.VITE_DISCORD_INVITE_URL }}"
            fi
            if [ -n "${{ vars.VITE_UMAMI_WEBSITE_ID }}" ]; then
              echo "VITE_UMAMI_WEBSITE_ID=${{ vars.VITE_UMAMI_WEBSITE_ID }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Builds the image and runs its smoke test on top, inside the builder: loading the image
      # into Docker to run it took up to 45s.
      - name: Build and smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}-smoke
          platforms: linux/amd64
          build-args: ${{ steps.build-args.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: ${{ env.CACHE_TO }}

      # Same inputs as the build above, so every layer comes from the builder's cache.
      - name: Push
        if: ${{ env.PUSH == 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.build-args.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.app }}

  # Points taiyo-deploy at the images just pushed. Argo CD then runs the migrations and
  # starts the new api and web next to the live ones; the Rollouts switch traffic over
  # as soon as the new pods are ready.
  release:
    name: Release to the cluster
    needs: [version, build]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Holds TAIYO_DEPLOY_KEY (write access to taiyomoe/taiyo-deploy) and only accepts
    # main: no pull request can read it.
    environment: release
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          repository: taiyomoe/taiyo-deploy
          ssh-key: ${{ secrets.TAIYO_DEPLOY_KEY }}

      - name: Point the release at this commit
        env:
          VERSION: ${{ needs.version.outputs.tag }}
        run: |
          # Runs of successive pushes can finish out of order: only the head of main
          # releases, so an older run never overwrites a newer tag.
          head=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "main moved on to $head: its own run releases it."
            exit 0
          fi

          tag="sha-${GITHUB_SHA::7}"
          sed -i -E "s/(newTag: )sha-[0-9a-f]+/\1${tag}/" apps/taiyo/app/kustomization.yaml
          if git diff --quiet; then
            echo "Already on ${tag}."
            exit 0
          fi

          git config user.name "taiyo-release"
          git config user.email "taiyo-release@users.noreply.github.com"
          git commit -am "chore: release taiyo ${VERSION:-$tag}" -m "From ${GITHUB_REPOSITORY}@${GITHUB_SHA} (${tag})"
          for _ in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1

  announce:
    name: Announce on Discord
    needs: [version, release]
    if: ${{ needs.version.outputs.tag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - run: node packages/scripts/src/release/post-discord-announcement.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ROLE_ID: "1189014041813852170"
