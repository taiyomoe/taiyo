name: Build images

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Pull requests only build, to catch a broken Dockerfile before merge. Images are
# pushed from develop alone, so no workflow triggered by a fork ever gets write access
# to the registry.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
  push:
    branches: ["develop"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # smoke imports the app's entry point inside the built image, with production
          # dependencies only: a runtime import of a dev dependency fails here instead of
          # crashing the pods. It exits right after the import: Redis clients open on import
          # and would fail later without a server. The worker starts its queues on import,
          # so it has none.
          - app: api
            target: server
            smoke: >-
              docker run --rm -e TEST=1 -e RESEND_API_KEY=re_smoke -e S3_PUBLIC_URL=https://cdn.example.invalid
              taiyo-api:ci node --import tsx -e "await import('./src/index.ts'); process.exit(0)"
          - app: worker
            target: server
          - app: web
            target: web
            smoke: >-
              docker run --rm taiyo-web:ci node -e "await import('./dist/server/server.js'); process.exit(0)"
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      # The web bundle inlines these public values, so a pushed image built without
      # them would ship a broken client.
      - name: Check the web build variables
        if: ${{ matrix.app == 'web' && env.PUSH == 'true' }}
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_BETTER_AUTH_URL: ${{ vars.VITE_BETTER_AUTH_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
        run: |
          missing=0
          for name in VITE_API_URL VITE_BETTER_AUTH_URL VITE_TURNSTILE_SITE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository variable $name is not set"
              missing=1
            fi
          done
          exit $missing

      - uses: docker/setup-buildx-action@v4

      - if: ${{ env.PUSH == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/taiyo-${{ matrix.app }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - id: build-args
        name: Build arguments
        run: |
          {
            echo "value<<EOF"
            echo "APP=${{ matrix.app }}"
            echo "VITE_API_URL=${{ vars.VITE_API_URL || 'https://example.invalid' }}"
            echo "VITE_BETTER_AUTH_URL=${{ vars.VITE_BETTER_AUTH_URL || 'https://example.invalid' }}"
            echo "VITE_TURNSTILE_SITE_KEY=${{ vars.VITE_TURNSTILE_SITE_KEY || 'placeholder' }}"
            if [ -n "${{ vars.VITE_DISCORD_INVITE_URL }}" ]; then
              echo "VITE_DISCORD_INVITE_URL=${{ vars.VITE_DISCORD_INVITE_URL }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          tags: taiyo-${{ matrix.app }}:ci
          build-args: ${{ steps.build-args.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

      - name: Smoke test
        if: ${{ matrix.smoke }}
        run: ${{ matrix.smoke }}

      # Same inputs as Build, so every layer comes from its cache.
      - name: Push
        if: ${{ env.PUSH == 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.build-args.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.app }}

  # Points taiyo-deploy at the images just pushed. Argo CD then runs the migrations and
  # starts the new api and web next to the live ones; traffic only switches once the
  # Rollouts are promoted.
  release:
    name: Release to the cluster
    needs: build
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Holds TAIYO_DEPLOY_KEY (write access to taiyomoe/taiyo-deploy) and only accepts
    # develop: no pull request can read it.
    environment: release
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          repository: taiyomoe/taiyo-deploy
          ssh-key: ${{ secrets.TAIYO_DEPLOY_KEY }}

      - name: Point the release at this commit
        run: |
          # Runs of successive pushes can finish out of order: only the head of develop
          # releases, so an older run never overwrites a newer tag.
          head=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/develop | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "develop moved on to $head: its own run releases it."
            exit 0
          fi

          tag="sha-${GITHUB_SHA::7}"
          sed -i -E "s/(newTag: )sha-[0-9a-f]+/\1${tag}/" apps/taiyo/app/kustomization.yaml
          if git diff --quiet; then
            echo "Already on ${tag}."
            exit 0
          fi

          git config user.name "taiyo-release"
          git config user.email "taiyo-release@users.noreply.github.com"
          git commit -am "chore: release taiyo ${tag}" -m "From ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          for _ in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
