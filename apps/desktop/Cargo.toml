[package]
name = "taiyo-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
image = "0.25.10"
metal = "0.29"
objc = "0.2"
raw-window-handle = "0.6"
rayon = "1.12.0"
rust-embed = "8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smallvec = "1"
unicode-segmentation = "1"
ureq = { version = "2", features = ["json"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

[features]
# Debug captures that draw and present frames themselves (needs a gpui with a
# public `Window::present`, patched in locally); see src/snapshot.rs.
snapshot = []
