services:
  postgres:
    image: "postgres:18-alpine"
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=500"]
    environment:
      - POSTGRES_USER=$DATABASE_USERNAME
      - POSTGRES_PASSWORD=$DATABASE_PASSWORD
      - POSTGRES_DB=$DATABASE_NAME
    ports:
      - "127.0.0.1:$DATABASE_PORT:5432"
    volumes:
      - "postgres:/var/lib/postgresql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 3s
      retries: 20

  dragonfly:
    image: "docker.dragonflydb.io/dragonflydb/dragonfly"
    restart: unless-stopped
    ulimits:
      memlock: -1
    environment:
      - DFLY_cluster_mode=emulated
      - DFLY_lock_on_hashtags=1
    ports:
      - "127.0.0.1:$DRAGONFLY_PORT:6379"
    volumes:
      - "dragonfly:/data"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  hyperdx:
    image: "docker.hyperdx.io/hyperdx/hyperdx-all-in-one"
    restart: unless-stopped
    ports:
      - "127.0.0.1:$HYPERDX_PORT:8080"
      - "127.0.0.1:$HYPERDX_OTLP_PORT:4318"
    volumes:
      - "hyperdx:/data/db"

  meilisearch:
    image: "getmeili/meilisearch:latest"
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=$MEILISEARCH_MASTER_KEY
      - MEILI_NO_ANALYTICS=true
    ports:
      - "127.0.0.1:$MEILISEARCH_PORT:7700"
    volumes:
      - "meilisearch:/meili_data"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      - RUSTFS_ACCESS_KEY=$RUSTFS_ACCESS_KEY
      - RUSTFS_SECRET_KEY=$RUSTFS_SECRET_KEY
      - RUSTFS_VOLUMES=/data
    ports:
      - "127.0.0.1:$RUSTFS_PORT:9000"
      - "127.0.0.1:$RUSTFS_CONSOLE_PORT:9001"
    volumes:
      - "rustfs:/data"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  postgres:
  dragonfly:
  hyperdx:
  meilisearch:
  rustfs:
