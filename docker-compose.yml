services:
  postgres:
    image: "postgres:18-alpine"
    restart: unless-stopped
    environment:
      - POSTGRES_USER=$DATABASE_USERNAME
      - POSTGRES_PASSWORD=$DATABASE_PASSWORD
      - POSTGRES_DB=$DATABASE_NAME
    ports:
      - "$DATABASE_PORT:5432"
    volumes:
      - "./data/postgres:/var/lib/postgresql/data"

  dragonfly:
    image: "docker.dragonflydb.io/dragonflydb/dragonfly"
    restart: unless-stopped
    ulimits:
      memlock: -1
    environment:
      - DFLY_cluster_mode=emulated
      - DFLY_lock_on_hashtags=1
    ports:
      - "$DRAGONFLY_PORT:6379"
    volumes:
      - "./data/dragonfly:/data"

  hyperdx:
    image: "docker.hyperdx.io/hyperdx/hyperdx-all-in-one"
    restart: unless-stopped
    ports:
      - "$HYPERDX_PORT:8080"
      - "$HYPERDX_OTLP_PORT:4318"

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      - RUSTFS_ACCESS_KEY=$RUSTFS_ACCESS_KEY
      - RUSTFS_SECRET_KEY=$RUSTFS_SECRET_KEY
      - RUSTFS_VOLUMES=/data
    ports:
      - "$RUSTFS_PORT:9000"
      - "$RUSTFS_CONSOLE_PORT:9001"
    volumes:
      - "./data/rustfs:/data"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 30
