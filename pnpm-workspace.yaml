packages:
  - apps/*
  - packages/*
  - tooling/*

allowBuilds:
  esbuild: false
  lefthook: true
  msgpackr-extract: true
  msw: false
  protobufjs: false
  sharp: true
  vue-demi: false

minimumReleaseAge: 10080 # 7 days

# Dev-time toolchain tracked at latest: none of it ships to production.
minimumReleaseAgeExclude:
  - oxlint
  - "@oxlint/*"
  - oxfmt
  - "@oxfmt/*"
  - "@vitejs/plugin-react"
  - oxc-transform-react
  - "@oxc-transform-react/*"
  - tsrs
  - "@tsrs/*"

# A second kysely copy makes Kysely<DB> unassignable to @better-auth/kysely-adapter's Kysely<any>.
overrides:
  kysely: ^0.29.5
